            const data = variants[currentVariant];
            let totalQuestions = 0;
            let correctCount = 0;

            // Helper to evaluate a task list
            const evaluateTask = (taskNum, items, isMultiInput = false) => {
                items.forEach((item, idx) => {
                    totalQuestions++;
                    const fbEl = document.getElementById(`fb-${taskNum}-${idx}`);
                    
                    if (isMultiInput && item.answers.length > 1) {
                        const in0 = document.querySelector(`input[data-task="${taskNum}"][data-idx="${idx}"][data-sub="0"]`);
                        const in1 = document.querySelector(`input[data-task="${taskNum}"][data-idx="${idx}"][data-sub="1"]`);
                        const ok0 = normalize(in0.value) === normalize(item.answers[0]);
                        const ok1 = normalize(in1.value) === normalize(item.answers[1]);

                        in0.classList.remove('input-correct', 'input-wrong');
                        in1.classList.remove('input-correct', 'input-wrong');
                        in0.classList.add(ok0 ? 'input-correct' : 'input-wrong');
                        in1.classList.add(ok1 ? 'input-correct' : 'input-wrong');

                        if (ok0 && ok1) {
                            correctCount++;
                            showFeedback(fbEl, true, `${item.answers[0]} ... ${item.answers[1]}`, item.explanation);
                        } else {
                            showFeedback(fbEl, false, `${item.answers[0]} ... ${item.answers[1]}`, item.explanation);
                        }
                    } else {
                        const input = document.querySelector(`input[data-task="${taskNum}"][data-idx="${idx}"][data-sub="0"]`);
                        const userVal = normalize(input.value);
                        const isMatch = item.answers.some(ans => normalize(ans) === userVal);

                        input.classList.remove('input-correct', 'input-wrong');
                        input.classList.add(isMatch ? 'input-correct' : 'input-wrong');

                        if (isMatch) {
                            correctCount++;
                            showFeedback(fbEl, true, item.answers[0], item.explanation);
                        } else {
                            showFeedback(fbEl, false, item.answers[0], item.explanation);
                        }
                    }
                });
            };

            evaluateTask(1, data.task1, false);
            evaluateTask(2, data.task2, true);
            evaluateTask(3, data.task3, false);
            evaluateTask(4, data.task4, false);
            evaluateTask(5, data.task5, false);

            const percent = Math.round((correctCount / totalQuestions) * 100);
            const scoreEl = document.getElementById('score-display');
            scoreEl.innerHTML = `Результат: <span class="text-blue-600 font-bold">${correctCount} из ${totalQuestions}</span> (${percent}%)`;
        }

        function showFeedback(el, isCorrect, correctAnswer, explanation) {
            el.classList.remove('hidden', 'bg-green-50', 'text-green-900', 'border-green-200', 'bg-red-50', 'text-red-900', 'border-red-200');
            if (isCorrect) {
                el.classList.add('bg-green-50', 'text-green-900', 'border', 'border-green-200');
                el.innerHTML = `<span class="font-bold">✓ Верно!</span> ${explanation}`;
            } else {
                el.classList.add('bg-red-50', 'text-red-900', 'border', 'border-red-200');
                el.innerHTML = `<span class="font-bold">✗ Правильный ответ: <u>${correctAnswer}</u></span><br><span class="text-slate-700">${explanation}</span>`;
            }
        }

        function resetWorksheet() {
            renderWorksheet();
        }

        // Initialize on load
        window.onload = function() {
            renderWorksheet();
        };
    </script>
</body>
</html>
