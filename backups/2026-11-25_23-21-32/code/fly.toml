# fly.toml app configuration file generated for deutsch-quest on 2026-11-25T22:26:13+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'deutsch-quest'
primary_region = 'fra'

[build]
  dockerfile = 'scripts/Dockerfile'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
